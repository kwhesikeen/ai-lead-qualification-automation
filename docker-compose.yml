services:
  n8n:
    image: n8nio/n8n:2.44.7
    container_name: cedarlead-n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5690:5678"

    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
